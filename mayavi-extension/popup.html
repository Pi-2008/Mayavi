<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Character Summoner</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Character Summoner</h1>

  <button id="micBtn" class="mic" title="Start hands-free listening" aria-label="Start hands-free listening">🎤</button>
  <div id="status" class="status">Ready</div>

  <div id="message" class="message" hidden></div>

  <button id="testBtn" class="link">Test animation (no voice)</button>
  <p class="hint">Click 🎤 once to start hands-free listening.<br />A small window opens. Keep it open (you can minimize it), then say “Om Kream Kutti Chatha” once on any website.</p>

  <script src="popup.js"></script>
</body>
</html>
